name: Check bundled runtime

on:
  schedule:
    - cron: '23 2 * * 3'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/WindowRescue/WindowRescue.csproj'
      - '.github/scripts/check_runtime.py'
      - '.github/workflows/runtime-update.yml'
      - 'tests/release/test_check_runtime.py'

permissions:
  contents: read

jobs:
  runtime:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Test runtime version check
        run: python -m unittest discover -s tests/release -p test_check_runtime.py
      - name: Compare with latest patch
        run: python .github/scripts/check_runtime.py
