# v で始まるタグ（例 v0.2.0）を push すると、テストして 1 ファイル exe を作り、GitHub リリースに添付する
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    outputs:
      release_tag: ${{ steps.publish_release.outputs.release_tag }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: "10.0.x"

      # バージョンは Directory.Build.props の <Version> を正とし、タグと一致しなければ中止する
      - name: Check version
        id: ver
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $v = $env:RELEASE_TAG.TrimStart("v")
          $props = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          if ($props -ne $v) { throw "タグ $v と Directory.Build.props の Version $props が一致しません" }
          "version=$v" >> $env:GITHUB_OUTPUT

      # 実際の画面・窓を操作する結合テストと、名前付きパイプのテストは CI では実行しない
      - name: Build with warnings as errors
        run: dotnet build WindowRescue.slnx -c Release -p:TreatWarningsAsErrors=true

      - name: Test
        run: dotnet test WindowRescue.slnx -c Release --no-build --settings tests/ci.runsettings

      - name: Publish single-file exe
        run: >
          dotnet publish src/WindowRescue/WindowRescue.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=None
          -o artifacts/release

      - name: Set up release tools
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Prepare ZIP checksum and English release notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python .github/scripts/release_assets.py prepare --repository "$env:GITHUB_REPOSITORY" --release-tag "$env:RELEASE_TAG" --asset-name WindowRescue-win-x64.zip --file artifacts/release/WindowRescue.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish ZIP and checksum
        id: publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $releaseArgs = @('release', 'create', $env:RELEASE_TAG, '--repo', $env:GITHUB_REPOSITORY,
            '--verify-tag', '--title', "Window Rescue $env:RELEASE_TAG", '--notes-file', 'artifacts/release/release-notes.md',
            'artifacts/release/WindowRescue-win-x64.zip', 'artifacts/release/WindowRescue-win-x64.zip.sha256')
          if ($env:RELEASE_TAG.Contains('-')) { $releaseArgs += '--prerelease' }
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "release_tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT

  check-published-release:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/virustotal-release.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
    secrets:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
